<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新自由民主社团</title>
    <!-- 引入外部 CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ===== 登录页面 ===== -->
    <div id="loginPage">
        <div class="login-box">
            <div class="logo-icon">🗽</div>
            <h1>新自由民主社团</h1>
            <p class="sub">登录以继续</p>
            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="loginUsername" class="input" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" class="input" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">登 录</button>
                <div id="loginError" class="login-error"></div>
            </form>
        </div>
    </div>

    <!-- ===== 主应用 ===== -->
    <div id="app" class="hidden">
        <!-- 导航栏 -->
        <nav class="navbar" id="mainNav">
            <div class="brand">🗽 新自由<span>民主</span>社团</div>
            <div class="nav-links" id="navLinks"></div>
        </nav>

        <!-- 页面容器 -->
        <div class="container" id="pageContainer">
            <!-- 管理员页面 -->
            <div id="adminPage" class="page">
                <div class="flex-between mb-20">
                    <h2>📊 管理员仪表盘</h2>
                    <span id="adminTimer" class="admin-timer hidden"></span>
                </div>
                <div class="stat-grid" id="adminStats">
                    <div class="stat-card"><div class="num" id="statUsers">0</div><div class="label">总用户</div></div>
                    <div class="stat-card"><div class="num" id="statNews">0</div><div class="label">新闻</div></div>
                    <div class="stat-card"><div class="num" id="statElections">0</div><div class="label">选举</div></div>
                    <div class="stat-card"><div class="num" id="statTickets">0</div><div class="label">工单</div></div>
                </div>
                <div class="grid-2">
                    <!-- 用户管理 -->
                    <div class="card">
                        <h3>👥 用户管理</h3>
                        <div id="adminUserList" class="mt-12" style="max-height:320px;overflow-y:auto;"></div>
                        <div class="mt-12 flex gap-8">
                            <button class="btn btn-sm btn-outline" id="adminRefreshUsers">刷新</button>
                        </div>
                    </div>
                    <!-- 新闻管理 -->
                    <div class="card">
                        <h3>📰 新闻管理</h3>
                        <div class="form-group mt-12">
                            <input type="text" id="adminNewsTitle" class="input" placeholder="新闻标题">
                        </div>
                        <div class="form-group">
                            <textarea id="adminNewsContent" class="textarea" placeholder="新闻内容"></textarea>
                        </div>
                        <div class="flex gap-8">
                            <button class="btn btn-sm btn-primary" id="adminNewsCreate">发布新闻</button>
                            <button class="btn btn-sm btn-outline" id="adminNewsRefresh">刷新列表</button>
                        </div>
                        <div id="adminNewsList" class="mt-12" style="max-height:260px;overflow-y:auto;"></div>
                    </div>
                    <!-- 选举管理 -->
                    <div class="card">
                        <h3>🗳️ 创建选举</h3>
                        <div class="form-group mt-12">
                            <input type="text" id="adminElectionTitle" class="input" placeholder="选举标题">
                        </div>
                        <div class="form-group">
                            <input type="text" id="adminElectionPosition" class="input" placeholder="职位名称 (如: 社长)">
                        </div>
                        <div class="form-group">
                            <label>候选人 (用逗号分隔用户名)</label>
                            <input type="text" id="adminElectionCandidates" class="input" placeholder="user1, user2, user3">
                        </div>
                        <div class="form-group">
                            <label>选民 (用逗号分隔用户名，留空则全部)</label>
                            <input type="text" id="adminElectionVoters" class="input" placeholder="user1, user2 (留空=全部)">
                        </div>
                        <div class="form-group">
                            <label>截止日期</label>
                            <input type="datetime-local" id="adminElectionEnd" class="input">
                        </div>
                        <button class="btn btn-sm btn-primary" id="adminElectionCreate">创建选举</button>
                        <div id="adminElectionList" class="mt-12" style="max-height:200px;overflow-y:auto;"></div>
                    </div>
                    <!-- 工单管理 -->
                    <div class="card">
                        <h3>🎫 工单管理</h3>
                        <div id="adminTicketList" class="mt-12" style="max-height:380px;overflow-y:auto;"></div>
                        <button class="btn btn-sm btn-outline mt-12" id="adminRefreshTickets">刷新工单</button>
                    </div>
                </div>
            </div>

            <!-- 新闻页面 -->
            <div id="newsPage" class="page">
                <div class="flex-between mb-20">
                    <h2>📰 社团新闻</h2>
                    <button class="btn btn-sm btn-outline" id="newsRefresh">刷新</button>
                </div>
                <div id="newsList" class="card"></div>
            </div>

            <!-- 选举页面 -->
            <div id="electionPage" class="page">
                <div class="flex-between mb-20">
                    <h2>🗳️ 选举投票</h2>
                    <button class="btn btn-sm btn-outline" id="electionRefresh">刷新</button>
                </div>
                <div id="electionList" class="grid-3"></div>
            </div>

            <!-- 工单页面 -->
            <div id="ticketPage" class="page">
                <div class="flex-between mb-20">
                    <h2>🎫 我的工单</h2>
                    <button class="btn btn-sm btn-primary" id="ticketNewBtn">+ 新建工单</button>
                </div>
                <div id="ticketList" class="card"></div>
                <div id="ticketForm" class="card mt-20 hidden">
                    <h3>新建工单</h3>
                    <div class="form-group mt-12">
                        <input type="text" id="ticketSubject" class="input" placeholder="主题">
                    </div>
                    <div class="form-group">
                        <textarea id="ticketContent" class="textarea" placeholder="详细描述"></textarea>
                    </div>
                    <div class="flex gap-8">
                        <button class="btn btn-sm btn-primary" id="ticketSubmit">提交</button>
                        <button class="btn btn-sm btn-outline" id="ticketCancel">取消</button>
                    </div>
                </div>
            </div>

            <!-- 聊天页面 -->
            <div id="chatPage" class="page">
                <div class="flex-between mb-20">
                    <h2>💬 社团聊天室</h2>
                    <span class="text-muted" id="chatOnline">在线</span>
                </div>
                <div class="card">
                    <div class="chat-box" id="chatMessages"></div>
                    <div class="flex gap-8">
                        <input type="text" id="chatInput" class="input" placeholder="输入消息..." style="flex:1;">
                        <button class="btn btn-primary" id="chatSend">发送</button>
                    </div>
                </div>
            </div>

            <!-- 个人信息查看 -->
            <div id="profileViewPage" class="page">
                <div class="card">
                    <h2>👤 个人信息</h2>
                    <div id="profileViewContent" class="mt-12"></div>
                </div>
            </div>

            <!-- 个人信息设置 -->
            <div id="profileSettingsPage" class="page">
                <div class="card">
                    <h2>⚙️ 个人设置</h2>
                    <form id="profileSettingsForm">
                        <div class="form-group mt-12">
                            <label>显示名称</label>
                            <input type="text" id="profileDisplayName" class="input" placeholder="昵称">
                        </div>
                        <div class="form-group">
                            <label>新密码 (留空不修改)</label>
                            <input type="password" id="profileNewPassword" class="input" placeholder="新密码">
                        </div>
                        <button type="submit" class="btn btn-primary">保存设置</button>
                        <div id="profileSettingsMsg" class="text-muted mt-12"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== 使用 importmap 加载 Firebase ========== -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
            }
        }
    </script>
    <!-- 引入主脚本 (module) -->
    <script type="module" src="script.js"></script>
</body>
</html>
